<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="tinycomplete: tiny autocomplete engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="140" fill="#7C3AED" opacity=".12"/>
  <circle cx="90" cy="320" r="120" fill="#06B6D4" opacity=".10"/>

  <!-- logo mark -->
  <g transform="translate(70,70) scale(1.15)">
    <rect width="128" height="128" rx="28" fill="url(#lg)"/>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M64 30 L34 62 M64 30 L64 62 M64 30 L94 62 M34 62 L34 92 M94 62 L94 92"/>
    </g>
    <g fill="#fff">
      <circle cx="64" cy="30" r="9"/><circle cx="34" cy="62" r="8"/><circle cx="64" cy="62" r="8"/>
      <circle cx="94" cy="62" r="8"/><circle cx="34" cy="94" r="8"/><circle cx="94" cy="94" r="8"/>
    </g>
    <rect x="61" y="80" width="6" height="28" rx="3" fill="#FDE047"/>
  </g>

  <!-- title -->
  <text x="240" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#F8FAFC">tiny<tspan fill="url(#ac)">complete</tspan></text>
  <text x="242" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#CBD5E1">Blazing-fast autocomplete from a Trie and a Heap.</text>
  <text x="242" y="236" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="20" fill="#94A3B8">zero dependencies  ·  top-k ranked  ·  ~200 lines</text>

  <!-- fake search box -->
  <g transform="translate(780,70)">
    <rect width="350" height="56" rx="14" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <text x="20" y="36" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="24" fill="#F8FAFC">py<tspan fill="#64748B">thon</tspan></text>
    <rect x="62" y="14" width="3" height="28" fill="#FDE047"/>
    <rect y="68" width="350" height="150" rx="14" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <rect x="8" y="76" width="334" height="40" rx="8" fill="#312E81"/>
    <g font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="21" fill="#E2E8F0">
      <text x="22" y="103"><tspan fill="#22D3EE" font-weight="700">py</tspan>thon</text>
      <text x="22" y="147"><tspan fill="#22D3EE" font-weight="700">py</tspan>torch</text>
      <text x="22" y="191"><tspan fill="#22D3EE" font-weight="700">py</tspan>test</text>
    </g>
    <g font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="16" fill="#94A3B8" text-anchor="end">
      <text x="330" y="103">95</text><text x="330" y="147">88</text><text x="330" y="191">40</text>
    </g>
  </g>
</svg>
